<svg xmlns="http://www.w3.org/2000/svg" width="920" height="526" viewBox="0 0 920 526" role="img" aria-labelledby="title description"><title id="title">DevHoony의 GitHub 활동</title><desc id="description">2026.11.02 집계. 최근 1년 GitHub 활동. 작성 커밋 140; 생성 PR 75; 소유 저장소 32. 공개·비공개 소유 저장소를 합산하고 포크와 회사 GitLab은 제외합니다. 계정에 연결된 작성 커밋을 기본 브랜치에서 중복 제거합니다. 그래프는 완료된 최근 12주의 커밋이며 언어 비중은 코드 바이트 기준입니다.</desc><rect width="920" height="526" rx="14" fill="#151b26"/>
