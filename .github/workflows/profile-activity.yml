name: Refresh profile activity

on:
  schedule:
    # 08:17 Asia/Seoul (23:17 UTC). GitHub may delay scheduled runs.
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'welcome2c/welcome2c'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check read credential
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Register PROFILE_STATS_TOKEN as described in docs/activity-stats.md.'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Collect aggregate activity
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_profile_stats.py

      - name: Publish profile statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add README.md assets/activity/summary.json
          if git diff --cached --quiet; then
            echo 'Statistics are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile activity [skip ci]'
          gh auth setup-git
          git push origin HEAD:master
